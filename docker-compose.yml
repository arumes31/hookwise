services:
  hookwise-proxy:
    build: .
    container_name: hookwise-proxy
    restart: unless-stopped
    # command is handled by Dockerfile ENTRYPOINT
    ports:
      - "5000:5000"
    environment: &env
      - "CW_URL=https://api-na.myconnectwise.net/v4_6_release/apis/3.0"
      - "CW_COMPANY=${CW_COMPANY:?Set CW_COMPANY}"
      - "CW_PUBLIC_KEY=${CW_PUBLIC_KEY:?Set CW_PUBLIC_KEY}"
      - "CW_PRIVATE_KEY=${CW_PRIVATE_KEY:?Set CW_PRIVATE_KEY}"
      - "CW_CLIENT_ID=${CW_CLIENT_ID:?Set CW_CLIENT_ID}"
      - "CW_TICKET_PREFIX=Alert:"
      - "CW_SERVICE_BOARD=Service Board"
      - "CW_STATUS_NEW=New"
      - "CW_STATUS_CLOSED=Closed"
      - "CW_DEFAULT_COMPANY_ID=${CW_DEFAULT_COMPANY_ID:?Set CW_DEFAULT_COMPANY_ID}"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      - "CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0"
      - "DATABASE_URL=postgresql://hookwise:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/hookwise"
      - "POSTGRES_USER=hookwise"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      - "POSTGRES_DB=hookwise"
      - "SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}"
      - "PORT=5000"
      - "DEBUG_MODE=false"
      - "FORCE_HTTPS=false"
      - "USE_PROXY=false"
      - "PROXY_FIX_COUNT=1"
      - "ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}"
      - "GUI_USERNAME=admin"
      - "GUI_PASSWORD=${GUI_PASSWORD:?Set GUI_PASSWORD}"
      - "GUI_TRUSTED_IPS="
      - "LOG_RETENTION_DAYS=30"
      - "OLLAMA_HOST=http://hookwise-llm:11434"
    depends_on:
      - redis
      - postgres
      - hookwise-llm
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  hookwise-worker:
    build: .
    container_name: hookwise-worker
    restart: unless-stopped
    command: celery -A worker.celery worker --loglevel=info -P gevent -c 100
    environment: *env
    depends_on:
      - redis
      - postgres
      - hookwise-llm
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  hookwise-beat:
    build: .
    container_name: hookwise-beat
    restart: unless-stopped
    command: celery -A worker.celery beat --loglevel=info
    environment: *env
    depends_on:
      - redis
      - postgres
      - hookwise-llm
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  hookwise-llm:
    image: ollama/ollama:latest@sha256:075246f72d4109385b4a01c3ac8e9cbd26a0bcb21cd7aa30edbccd24e1b3180c
    container_name: hookwise-llm
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Ollama automatically uses CPU if no GPU is detected

  redis:
    image: redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: hookwise-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    environment:
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    security_opt: [no-new-privileges:true]
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: hookwise-db
    restart: unless-stopped
    environment:
      - "POSTGRES_USER=hookwise"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      - "POSTGRES_DB=hookwise"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt: [no-new-privileges:true]

volumes:
  redis_data:
  postgres_data:
  ollama_data:
