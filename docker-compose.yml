services:
  hookwise-proxy:
    build: .
    container_name: hookwise-proxy
    restart: unless-stopped
    # command is handled by Dockerfile ENTRYPOINT
    ports:
      - "5000:5000"
    environment: &env
      - "CW_URL=https://api-na.myconnectwise.net/v4_6_release/apis/3.0"
      - "CW_COMPANY=${CW_COMPANY:?Set CW_COMPANY}"
      - "CW_PUBLIC_KEY=${CW_PUBLIC_KEY:?Set CW_PUBLIC_KEY}"
      - "CW_PRIVATE_KEY=${CW_PRIVATE_KEY:?Set CW_PRIVATE_KEY}"
      - "CW_CLIENT_ID=${CW_CLIENT_ID:?Set CW_CLIENT_ID}"
      - "CW_TICKET_PREFIX=Alert:"
      - "CW_SERVICE_BOARD=Service Board"
      - "CW_STATUS_NEW=New"
      - "CW_STATUS_CLOSED=Closed"
      - "CW_DEFAULT_COMPANY_ID=${CW_DEFAULT_COMPANY_ID:?Set CW_DEFAULT_COMPANY_ID}"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      - "CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0"
      - "DATABASE_URL=postgresql://${POSTGRES_USER:-hookwise}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-hookwise}"
      - "POSTGRES_USER=hookwise"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      - "POSTGRES_DB=hookwise"
      - "SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}"
      - "PORT=5000"
      - "DEBUG_MODE=false"
      - "FORCE_HTTPS=false"
      - "USE_PROXY=false"
      - "PROXY_FIX_COUNT=1"
      - "ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}"
      - "GUI_USERNAME=admin"
      - "GUI_PASSWORD=${GUI_PASSWORD:?Set GUI_PASSWORD}"
      - "GUI_TRUSTED_IPS="
      - "LOG_RETENTION_DAYS=30"
      - "OLLAMA_HOST=http://hookwise-llm:11434"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      hookwise-llm:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  hookwise-worker:
    build: .
    container_name: hookwise-worker
    restart: unless-stopped
    command: celery -A worker.celery worker --loglevel=info -P gevent -c 100
    environment: *env
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      hookwise-llm:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  hookwise-beat:
    build: .
    container_name: hookwise-beat
    restart: unless-stopped
    command: celery -A worker.celery beat --loglevel=info
    environment: *env
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      hookwise-llm:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  hookwise-llm:
    image: ollama/ollama:latest@sha256:075246f72d4109385b4a01c3ac8e9cbd26a0bcb21cd7aa30edbccd24e1b3180c
    container_name: hookwise-llm
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Ollama automatically uses CPU if no GPU is detected

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: hookwise-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    environment:
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    security_opt: [no-new-privileges:true]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: hookwise-db
    restart: unless-stopped
    environment:
      - "POSTGRES_USER=hookwise"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      - "POSTGRES_DB=hookwise"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
  ollama_data:
