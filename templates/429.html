{% extends 'base.html' %}

{% block content %}
<main class="hw-state-page" aria-labelledby="rate-limit-title">
    <div class="hw-state-code" aria-hidden="true">429</div>
    <h1 id="rate-limit-title">Request limit reached</h1>
    <p>Hookwise is protecting the service from too many requests. Wait a moment, then retry.</p>
    <div class="hw-state-actions">
        <button type="button" class="btn btn-primary" onclick="window.location.reload()">Try again</button>
        <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">Return to dashboard</a>
    </div>
    {% if request_id %}<p class="hw-state-reference">Reference <code>{{ request_id }}</code></p>{% endif %}
</main>
{% endblock %}
