{% extends 'base.html' %}

{% block content %}
<main class="hw-state-page" aria-labelledby="not-found-title">
    <div class="hw-state-code" aria-hidden="true">404</div>
    <h1 id="not-found-title">Page not found</h1>
    <p>The address may be outdated, or the page may have moved.</p>
    <div class="hw-state-actions">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to dashboard</a>
    </div>
    {% if request_id %}<p class="hw-state-reference">Reference <code>{{ request_id }}</code></p>{% endif %}
</main>
{% endblock %}
