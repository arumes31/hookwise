{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="mb-4 text-warning">
            <svg class="hw-icon" width="64" height="64" aria-hidden="true" focusable="false"><use href="#i-tools"></use></svg>
        </div>
        <h1 class="fw-bold">Scheduled Maintenance</h1>
        <p class="text-secondary mb-5 h5">HookWise is currently undergoing scheduled maintenance. We'll be back online shortly.</p>
        <div class="card bg-dark border-warning border-opacity-25 py-3">
            <p class="mb-0 small text-warning">System administrators can still access the dashboard by appending /admin to the URL if authorized.</p>
        </div>
    </div>
</div>
{% endblock %}
