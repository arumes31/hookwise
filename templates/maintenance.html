{% extends 'base.html' %}

{% block content %}
<main class="hw-state-page" aria-labelledby="maintenance-title">
    <svg class="hw-state-icon" width="48" height="48" aria-hidden="true" focusable="false"><use href="#i-tools"></use></svg>
    <h1 id="maintenance-title">Scheduled maintenance</h1>
    <p>Hookwise is temporarily unavailable while maintenance is in progress. Existing webhook requests receive a service-unavailable response.</p>
    <div class="hw-state-actions">
        <button type="button" class="btn btn-primary" onclick="window.location.reload()">Check status again</button>
    </div>
    {% if request_id %}<p class="hw-state-reference">Reference <code>{{ request_id }}</code></p>{% endif %}
</main>
{% endblock %}
