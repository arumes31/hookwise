name: CI

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main, v2_test ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_DB: hookwise_test
          POSTGRES_USER: hookwise
          POSTGRES_PASSWORD: hookwise_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python 3.13
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --requirement requirements-dev.txt
        python -m pip install --no-deps --editable .

    - name: Lint with ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy .

    - name: Run tests
      env:
        DATABASE_URL: postgresql://hookwise:hookwise_pass@localhost:5432/hookwise_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        TESTING: "true"
      run: |
        ls -R
        pytest tests/ -v

    - name: Audit dependencies for known vulnerabilities
      run: |
        python -m pip install pip-audit==2.10.1
        pip-audit --requirement requirements.txt --progress-spinner off

    - name: Check for migration drift
      # Non-blocking for now: the repo has pre-existing model/migration drift
      # (user.otp_secret length, webhook_log FK ondelete=CASCADE). Once those are
      # reconciled with a migration, drop continue-on-error to make this a gate.
      continue-on-error: true
      env:
        FLASK_APP: hookwise:create_app
        DATABASE_URL: postgresql://hookwise:hookwise_pass@localhost:5432/hookwise_test
        SECRET_KEY: test-secret-key
        GUI_PASSWORD: test-password
        ENCRYPTION_KEY: vmJ34RDpkZk7-sUqAwq0lMA2QN0P0SEAEuC874kov5E=
        REDIS_HOST: localhost
        TESTING: "true"
      run: |
        flask db upgrade
        flask db check

  container:
    name: Build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: hookwise:${{ github.sha }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hookwise:${{ github.sha }}
          version: v0.74.0
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'
