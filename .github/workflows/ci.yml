name: CI

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main, v2_test ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: hookwise_test
          POSTGRES_USER: hookwise
          POSTGRES_PASSWORD: hookwise_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14.7
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14.7'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes -r requirements-dev.txt
        python -m pip install --no-deps -e .

    - name: Restore lint and type-check caches
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .ruff_cache
          .mypy_cache
        key: quality-${{ runner.os }}-py3.14-${{ hashFiles('requirements-dev.txt', 'pyproject.toml', 'mypy.ini') }}
        restore-keys: quality-${{ runner.os }}-py3.14-

    - name: Lint with ruff
      run: ruff check .

    - name: Check formatting with ruff
      run: ruff format --check .

    - name: Type check with mypy
      run: mypy .

    - name: Run tests
      env:
        DATABASE_URL: postgresql://hookwise:hookwise_pass@localhost:5432/hookwise_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        TESTING: "true"
      run: pytest tests/ -v

    - name: Audit dependencies for known vulnerabilities
      run: python -m pip_audit -r requirements.txt

    - name: Check for migration drift
      env:
        FLASK_APP: hookwise:create_app
        DATABASE_URL: postgresql://hookwise:hookwise_pass@localhost:5432/hookwise_test
        SECRET_KEY: test-secret-key
        GUI_PASSWORD: test-password
        ENCRYPTION_KEY: vmJ34RDpkZk7-sUqAwq0lMA2QN0P0SEAEuC874kov5E=
        REDIS_HOST: localhost
        TESTING: "true"
      run: |
        flask db upgrade
        flask db check
