name: CI

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main, v2_test ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: hookwise_test
          POSTGRES_USER: hookwise
          POSTGRES_PASSWORD: hookwise_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14.6
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14.6'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes -r requirements-dev.txt
        python -m pip install --no-deps -e .

    - name: Restore lint and type-check caches
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .ruff_cache
          .mypy_cache
        key: quality-${{ runner.os }}-py3.14-${{ hashFiles('requirements-dev.txt', 'pyproject.toml', 'mypy.ini') }}
        restore-keys: quality-${{ runner.os }}-py3.14-

    - name: Lint with ruff
      run: ruff check .

    - name: Check formatting with ruff
      run: ruff format --check .

    - name: Type check with mypy
      run: mypy .

    - name: Run tests
      env:
        DATABASE_URL: postgresql://hookwise:hookwise_pass@localhost:5432/hookwise_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        TESTING: "true"
      run: pytest tests/ -v

    - name: Audit dependencies for known vulnerabilities
      run: python -m pip_audit -r requirements.txt

    - name: Check for migration drift
      env:
        FLASK_APP: hookwise:create_app
        DATABASE_URL: postgresql://hookwise:hookwise_pass@localhost:5432/hookwise_test
        SECRET_KEY: test-secret-key
        GUI_PASSWORD: test-password
        ENCRYPTION_KEY: vmJ34RDpkZk7-sUqAwq0lMA2QN0P0SEAEuC874kov5E=
        REDIS_HOST: localhost
        TESTING: "true"
      run: |
        flask db upgrade
        flask db check

  container:
    name: Build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: hookwise:${{ github.sha }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hookwise:${{ github.sha }}
          version: v0.74.0
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'
