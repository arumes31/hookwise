name: CI

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main, v2_test ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hookwise_test
          POSTGRES_USER: hookwise
          POSTGRES_PASSWORD: hookwise_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14.6
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14.6'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Lint with ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy .

    - name: Run tests
      env:
        DATABASE_URL: postgresql://hookwise:hookwise_pass@localhost:5432/hookwise_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        TESTING: "true"
      run: |
        ls -R
        pytest tests/ -v

    - name: Audit dependencies for known vulnerabilities
      continue-on-error: true  # surface CVEs without blocking merges initially
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt

    - name: Check for migration drift
      # Non-blocking for now: the repo has pre-existing model/migration drift
      # (user.otp_secret length, webhook_log FK ondelete=CASCADE). Once those are
      # reconciled with a migration, drop continue-on-error to make this a gate.
      continue-on-error: true
      env:
        FLASK_APP: hookwise:create_app
        DATABASE_URL: postgresql://hookwise:hookwise_pass@localhost:5432/hookwise_test
        SECRET_KEY: test-secret-key
        GUI_PASSWORD: test-password
        ENCRYPTION_KEY: vmJ34RDpkZk7-sUqAwq0lMA2QN0P0SEAEuC874kov5E=
        REDIS_HOST: localhost
        TESTING: "true"
      run: |
        flask db upgrade
        flask db check
