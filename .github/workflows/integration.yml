name: Integration

# Runs the real stack (proxy, worker, beat, migrations, Postgres, Redis) against
# a local ConnectWise mock and drives it with a browser per role. Covers what
# the unit suite cannot see: broker/worker/beat interplay, page scripts calling
# routes a role may not use, and controls hidden by CSS.
on:
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: Full stack and browser roles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: hookwise-it
      COMPOSE_FILE: docker-compose.yml:tests/integration/docker-compose.integration.yml
      HOOKWISE_IT_BASE_URL: http://localhost:5000
      # Synthetic values for an isolated, throwaway stack. ConnectWise is the
      # mock from the overlay, never a real instance.
      CW_COMPANY: integration
      CW_PUBLIC_KEY: integration
      CW_PRIVATE_KEY: integration
      CW_CLIENT_ID: integration
      REDIS_PASSWORD: hookwise-integration-redis
      POSTGRES_PASSWORD: hookwise-integration-postgres
      SECRET_KEY: hookwise-synthetic-integration-session-key
      ENCRYPTION_KEY: vmJ34RDpkZk7-sUqAwq0lMA2QN0P0SEAEuC874kov5E=
      GUI_PASSWORD: HookWise-Integration-Only-2026

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          cache: 'pip'

      - name: Install test dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r tests/integration/requirements.txt
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run integration tests
        run: pytest tests/integration -v

      - name: Show stack logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose down -v
