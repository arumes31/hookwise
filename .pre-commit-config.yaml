# Runs the same quality gate as CI (.github/workflows/ci.yml) before each commit.
#
#   uv tool install pre-commit      # or: pipx install pre-commit
#   pre-commit install
#
# The hooks call the tools from the active Python environment, so activate the
# project virtualenv first; that keeps the ruff and mypy versions identical to
# requirements-dev.txt and CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (whole repository, as in CI)
        entry: mypy .
        language: system
        pass_filenames: false
        types_or: [python, pyi]
