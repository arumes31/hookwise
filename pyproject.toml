[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hookwise"
version = "0.1.0"
description = "A webhook management system"
authors = [{name = "arumes31"}]
dependencies = [
    "celery==5.6.3",
    "cryptography==50.0.1",
    "flask==3.1.3",
    "flask-limiter==4.1.1",
    "flask-migrate==4.1.0",
    "flask-socketio==5.6.1",
    "flask-sqlalchemy==3.1.1",
    "gunicorn==26.0.0",
    "jsonpath-ng==1.8.0",
    "prometheus-client==0.25.0",
    "psycopg2-binary==2.9.12",
    "pyotp==2.10.0",
    "python-dotenv==1.2.2",
    "python-socketio==5.16.4",
    "redis==8.1.0",
    "requests==2.34.2",
    "segno==1.6.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hookwise*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false  # Flask extension decorators do not expose useful typing metadata.
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = [
    "flask.*",
    "celery.*",
    "prometheus_client.*",
    "redis.*",
    "werkzeug.*",
    "dotenv.*",
    "flask_sqlalchemy.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
