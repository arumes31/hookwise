[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hookwise"
version = "2.4.0"
description = "Enterprise webhook router and ConnectWise Manage bridge"
authors = [{name = "HookWise Team"}]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "flask",
    "celery",
    "redis",
    "requests",
    "flask-sqlalchemy",
    "flask-migrate",
    "flask-limiter",
    "flask-socketio",
    "flask-wtf",
    "prometheus-client",
    "cryptography",
    "gevent",
    "jsonpath-ng",
    "psycopg2-binary",
    "pyotp",
    "python-dotenv",
    "regex",
    "gunicorn",
    "segno"
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pip-audit",
    "pytest==9.1.1",
    "ruff==0.16.5",
    "types-requests==2.33.0.20260712",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hookwise*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = [
    "flask.*",
    "celery.*",
    "prometheus_client.*",
    "redis.*",
    "werkzeug.*",
    "dotenv.*",
    "flask_sqlalchemy.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
